<!doctype html><meta charset="utf-8"><title>Signal motion performance check</title>
<style>body{margin:0;background:#F7F1ED;font:14px monospace}#field{width:640px;height:720px}.signal-field{margin:0;display:grid;grid-template-rows:90px 530px 100px;height:100%}canvas{width:100%;height:100%;min-height:0}figcaption,.ascii-caption{display:flex;justify-content:space-between;padding:24px}pre{position:fixed;left:660px;top:0;white-space:pre-wrap;max-width:500px}</style>
<div id="field"></div><pre id="result">Measuring actual canvas drawing during repeated transitions…</pre>
<script src="../js/signalField.js"></script><script>
(async()=>{
 const samples=[],frames=[],counts=[],scene=new AsciiVolumeScene('field');let previous;
 const draw=scene.draw.bind(scene);
 scene.draw=now=>{const start=performance.now();draw(now);samples.push(performance.now()-start);if(now&&previous)frames.push(now-previous);if(now)previous=now;counts.push(scene.particles.length);};
 const image=document.createElement('canvas');image.width=900;image.height=600;const c=image.getContext('2d');
 c.fillStyle='#fff';c.fillRect(0,0,900,600);c.fillStyle='#333';c.fillRect(80,80,740,440);c.fillStyle='#fff';c.font='bold 120px monospace';c.fillText('SIGNAL',210,330);
 const src=image.toDataURL();const wait=ms=>new Promise(r=>setTimeout(r,ms));
 await wait(900);
 for(let i=1;i<=4;i++){await scene.setPost({id:i,src,title:'TRANSITION '+i});await wait(i<4?700:2200);}
 const percentile=(values,p)=>values.slice().sort((a,b)=>a-b)[Math.floor((values.length-1)*p)];
 document.getElementById('result').textContent=JSON.stringify({draws:samples.length,drawMedianMs:percentile(samples,.5),drawP95Ms:percentile(samples,.95),frameMedianMs:percentile(frames,.5),frameP95Ms:percentile(frames,.95),peakFallingGlyphs:Math.max(...counts),remainingGlyphs:scene.particles.length,resolvedGlyphs:scene.renderedCount},null,2);
 scene.destroy();
})();
</script>
